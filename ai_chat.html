<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sasayaki 囁き // AI chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"KozGo";src:url("fonts/KozGoPr6N-Regular.otf");font-weight:400;font-display:swap}
@font-face{font-family:"KozGo";src:url("fonts/KozGoPr6N-Medium.otf");font-weight:500;font-display:swap}
@font-face{font-family:"KozGo";src:url("fonts/KozGoPr6N-Bold.otf");font-weight:700;font-display:swap}
@font-face{font-family:"Klavika";src:url("fonts/klavika-bold.otf");font-weight:700;font-display:swap}
:root{color-scheme:dark;
  --bg:#181a1b;--surf:#1d1f20;--surf2:#232526;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.11);
  --txt:#e8e6e3;--muted:#9b958f;--dim:#5d5852;
  --pk:#e4405f;--pk2:#ff7a99;--pk3:rgba(228,64,95,.14);
  --green:#3fdc97;--amber:#f1c453;--blue:#5b8cff;
  --r:8px;--ease:cubic-bezier(.16,1,.3,1);
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --body:"KozGo","Inter",system-ui,sans-serif;
  --logo:"Klavika","KozGo",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.55 var(--body);overflow-x:hidden;min-height:100dvh;-webkit-font-smoothing:antialiased}
#amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#amb .wash{position:absolute;inset:-5%;background:radial-gradient(ellipse 60% 40% at 20% -5%,var(--pk3),transparent 60%),radial-gradient(ellipse 50% 35% at 90% 100%,rgba(228,64,95,.08),transparent 60%)}
a{color:var(--pk2);text-decoration:none}a:hover{text-decoration:underline}
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:0 20px}
.topinner{max-width:900px;margin:0 auto;height:54px;display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.logo{font:700 16px var(--logo);letter-spacing:-.3px;white-space:nowrap;color:var(--txt)}
.logo span{color:var(--pk)}

/* chat is a full-height column: header row, scrolling message list, composer pinned at the bottom */
.chatwrap{max-width:900px;margin:0 auto;padding:0 20px;position:relative;z-index:1;
  height:calc(100dvh - 54px);display:flex;flex-direction:column}
.chead{display:flex;align-items:center;gap:12px;padding:18px 2px 12px;flex-wrap:wrap}
.chead h1{font:700 22px var(--logo);letter-spacing:-.4px}
.chead h1 .jp{color:var(--pk);font-weight:400}
.chead .spacer{flex:1}
.model{font:11px var(--mono);color:var(--muted);background:var(--surf2);border:1px solid var(--line);
  border-radius:20px;padding:4px 11px;white-space:nowrap}
.model b{color:var(--pk2);font-weight:600}
.newbtn{background:var(--surf2);color:var(--muted);border:1px solid var(--line2);border-radius:var(--r);
  font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;cursor:pointer;transition:.15s}
.newbtn:hover{border-color:var(--pk);color:var(--txt)}

.msgs{flex:1;overflow-y:auto;padding:8px 2px 14px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:9px}.msgs::-webkit-scrollbar-thumb{background:var(--line2);border-radius:20px}
.row{display:flex;width:100%}
.row.user{justify-content:flex-end}
.row.assistant{justify-content:flex-start}
.bubble{max-width:80%;border-radius:14px;padding:12px 15px;font:13px/1.6 var(--mono);white-space:pre-wrap;word-wrap:break-word;
  border:1px solid var(--line);position:relative}
.row.user .bubble{background:var(--pk3);border-color:rgba(228,64,95,.28);color:var(--txt);border-bottom-right-radius:5px}
.row.assistant .bubble{background:var(--surf);color:var(--txt);border-bottom-left-radius:5px}
.bubble b,.bubble strong{color:var(--pk2);font-weight:600}
.bubble code{font-family:var(--mono);background:var(--surf2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--pk2);font-size:12px}
.bubble a{color:var(--pk2)}
.who{font:10px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:5px}
.row.user .who{text-align:right}
.bubble.thinking{color:var(--muted)}
.dots span{opacity:.35;animation:blink 1.2s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.sources{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.sources .sh{font:9px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.sources a{font:11px var(--mono);color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sources a:hover{color:var(--pk2)}
.sources a .dom{color:var(--pk2)}
.empty{margin:auto;text-align:center;color:var(--dim);max-width:44ch}
.empty .big{font:700 20px var(--logo);color:var(--muted);margin-bottom:8px}
.empty .ex{font:12px var(--mono);color:var(--dim);margin-top:14px;line-height:1.9}
.empty .ex span{display:inline-block;background:var(--surf2);border:1px solid var(--line);border-radius:20px;
  padding:4px 11px;margin:3px;cursor:pointer;transition:.15s;color:var(--muted)}
.empty .ex span:hover{border-color:var(--pk);color:var(--txt)}

.composer{padding:12px 0 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.crow{display:flex;gap:10px;align-items:flex-end}
#inp{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:12px;color:var(--txt);
  font:13px/1.5 var(--mono);padding:12px 14px;outline:none;resize:none;max-height:180px;min-height:46px;transition:border-color .2s,box-shadow .2s}
#inp:focus{border-color:var(--pk);box-shadow:0 0 0 2px var(--pk3)}
#send{background:var(--pk);color:#fff;border:none;border-radius:12px;font:700 13px var(--logo);letter-spacing:.3px;
  padding:0 22px;height:46px;cursor:pointer;transition:.15s;white-space:nowrap}
#send:hover{background:var(--pk2)}#send:disabled{opacity:.45;cursor:default}
.ctrls{display:flex;align-items:center;gap:14px;font:11px var(--mono);color:var(--muted);flex-wrap:wrap}
.webtog{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:4px 10px;border-radius:20px;
  border:1px solid var(--line);transition:.15s}
.webtog:hover{border-color:var(--line2)}
.webtog.on{border-color:var(--pk);background:var(--pk3);color:var(--pk2)}
.webtog input{accent-color:var(--pk);margin:0}
.hint{color:var(--dim)}
</style></head><body>
<div id="amb"><div class="wash"></div></div>
<div class="topbar"><div class="topinner">
  <a class="logo" href="/" data-realm-home style="text-decoration:none">Sasayaki<span>//囁き</span></a>
  <div id="realmnav" data-theme-host></div><script src="/realm.js"></script>
</div></div>

<div class="chatwrap">
  <div class="chead">
    <h1>AI chat <span class="jp">相談</span></h1>
    <div class="spacer"></div>
    <div class="model" id="model">local · <b id="modelName">uncensored</b></div>
    <button class="newbtn" id="newBtn" title="Start a fresh session">＋ new chat</button>
  </div>

  <div class="msgs" id="msgs"></div>

  <div class="composer">
    <div class="crow">
      <textarea id="inp" rows="1" placeholder="Tell it anything…  (Enter to send · Shift+Enter for newline)" spellcheck="false"></textarea>
      <button id="send">Send</button>
    </div>
    <div class="ctrls">
      <label class="webtog on" id="libTog" title="Ground answers in YOUR library (creators, works, tags) — ON by default so it stops making things up"><input type="checkbox" id="lib" checked> 📚 library</label>
      <label class="webtog on" id="webTog" title="Let the AI search the web for this message — ON by default: ungrounded local answers hallucinate"><input type="checkbox" id="web" checked> 🌐 web</label>
      <span class="hint">Private local model · full uncensored session · thread saved in this browser</span>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY = "sasa_chat";
  var thread = [];                         // [{role,content}] persisted; sources ride along on assistant msgs for redraw
  var busy = false;
  var q = function(s){ return document.querySelector(s); };
  var msgsEl = q("#msgs"), inp = q("#inp");

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  // minimal, safe markdown-lite: escape first, then re-introduce a few inline forms
  function fmt(s){
    var h = esc(s);
    h = h.replace(/```([\s\S]*?)```/g, function(_,c){ return "<code>"+c.replace(/\n/g,"&#10;")+"</code>"; });
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    h = h.replace(/(^|[\s(])(https?:\/\/[^\s)]+)/g, function(_,p,u){ return p+'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'; });
    return h;
  }

  function load(){ try{ thread = JSON.parse(localStorage.getItem(KEY)||"[]"); if(!Array.isArray(thread)) thread=[]; }catch(e){ thread=[]; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(thread.slice(-120))); }catch(e){} }

  function sourcesHtml(src){
    if(!src || !src.length) return "";
    var h = '<div class="sources"><div class="sh">web sources</div>';
    src.forEach(function(s){
      h += '<a href="'+esc(s.url)+'" target="_blank" rel="noopener" title="'+esc(s.url)+'">'
         + '<span class="dom">'+esc(s.domain||"")+'</span> — '+esc(s.title||s.url)+'</a>';
    });
    return h + '</div>';
  }

  function groundedHtml(g){
    if(!g || !g.length) return "";
    var label = g.map(function(x){ return x==="library" ? "📚 library" : (x==="web" ? "🌐 web" : x); }).join(" · ");
    return '<div style="margin-top:7px;font:10px ui-monospace,Menlo,Consolas,monospace;opacity:.55;letter-spacing:.03em">grounded in '+esc(label)+'</div>';
  }

  function bubble(role, content, opts){
    opts = opts || {};
    var row = document.createElement("div"); row.className = "row " + role;
    var wrap = document.createElement("div"); wrap.style.maxWidth = "80%";
    var who = document.createElement("div"); who.className = "who"; who.textContent = role === "user" ? "you" : "assistant";
    var b = document.createElement("div"); b.className = "bubble" + (opts.thinking ? " thinking" : "");
    if(opts.thinking){ b.innerHTML = '…thinking<span class="dots"><span>.</span><span>.</span><span>.</span></span>'; }
    else { b.innerHTML = fmt(content) + sourcesHtml(opts.sources) + groundedHtml(opts.grounded); }
    wrap.appendChild(who); wrap.appendChild(b); row.appendChild(wrap); msgsEl.appendChild(row);
    scrollDown();
    return b;
  }

  function scrollDown(){ msgsEl.scrollTop = msgsEl.scrollHeight; }

  function emptyState(){
    msgsEl.innerHTML = "";
    var d = document.createElement("div"); d.className = "empty";
    d.innerHTML = '<div class="big">Say anything.</div>'
      + 'A private, uncensored session that runs on your own hardware. Ask about the archive, or anything at all — flip on 🌐 <b>web</b> and it can look things up.'
      + '<div class="ex">'
      + '<span>what makes good sleep ASMR?</span>'
      + '<span>who does the best ear cleaning?</span>'
      + '<span>latest DLsite ASMR releases</span>'
      + '<span>explain binaural recording</span>'
      + '</div>';
    msgsEl.appendChild(d);
    d.querySelectorAll(".ex span").forEach(function(el){
      el.onclick = function(){ inp.value = el.textContent; inp.focus(); autosize(); };
    });
  }

  function render(){
    if(!thread.length){ emptyState(); return; }
    msgsEl.innerHTML = "";
    thread.forEach(function(m){ bubble(m.role, m.content, { sources: m.sources, grounded: m.grounded }); });
    scrollDown();
  }

  function setModel(name){ if(name) q("#modelName").textContent = name; }

  // POST the whole thread; handle either a final JSON reply OR a {pending:id} we poll.
  function ask(){
    if(busy) return;
    var text = inp.value.trim(); if(!text) return;
    busy = true; q("#send").disabled = true;
    thread.push({ role:"user", content:text }); save();
    if(msgsEl.querySelector(".empty")) msgsEl.innerHTML = "";
    bubble("user", text);
    inp.value = ""; autosize();
    var think = bubble("assistant", "", { thinking:true });

    var payload = { messages: thread.map(function(m){ return { role:m.role, content:m.content }; }),
                    web: q("#web").checked, lib: q("#lib").checked };

    function done(d){
      busy = false; q("#send").disabled = false;
      var reply = (d && d.reply) || "";
      if(d && d.error && !reply){ reply = "⚠️ " + d.error; }
      if(!reply){ reply = "⚠️ no response from the model."; }
      setModel((d && d.model) || null);
      think.classList.remove("thinking");
      think.innerHTML = fmt(reply) + sourcesHtml(d && d.sources) + groundedHtml(d && d.grounded);
      thread.push({ role:"assistant", content:reply, sources:(d && d.sources) || [], grounded:(d && d.grounded) || [] }); save();
      scrollDown();
    }
    function fail(msg){
      busy = false; q("#send").disabled = false;
      think.classList.remove("thinking");
      think.innerHTML = fmt("⚠️ " + msg);
      thread.push({ role:"assistant", content:"⚠️ " + msg }); save();
    }

    function poll(id, tries){
      if(tries > 240){ fail("timed out waiting for a reply."); return; }
      fetch("/ai-chat/result?id=" + encodeURIComponent(id), { cache:"no-store" })
        .then(function(r){ return r.json(); })
        .then(function(d){ if(d && d.pending){ setTimeout(function(){ poll(id, tries+1); }, 1000); } else { done(d); } })
        .catch(function(e){ fail(String(e)); });
    }

    fetch("/ai-chat/ask", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.pending){ poll(d.pending, 0); } else { done(d); } })
      .catch(function(e){ fail(String(e)); });
  }

  function autosize(){ inp.style.height = "auto"; inp.style.height = Math.min(inp.scrollHeight, 180) + "px"; }

  q("#send").onclick = ask;
  inp.addEventListener("input", autosize);
  inp.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(); }
  });
  q("#newBtn").onclick = function(){
    if(thread.length && !confirm("Start a new chat? This session will be cleared.")) return;
    thread = []; save(); render(); inp.focus();
  };
  q("#webTog").addEventListener("change", function(){ this.classList.toggle("on", q("#web").checked); });
  q("#libTog").addEventListener("change", function(){ this.classList.toggle("on", q("#lib").checked); });

  load(); render(); autosize(); inp.focus();
})();
</script>
</body></html>
