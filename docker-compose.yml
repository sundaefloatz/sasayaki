# Sasayaki CPU-only core — the "point it at a library you already have" viewer.
# No GPU, no models, no scrapers. ASR/translate/search/triggers degrade to empty/absent.
#
# Quickstart:
#   1. Copy .env.example to .env and set SASAYAKI_LIBRARY to your media folder.
#   2. docker compose up -d --build
#   3. Open http://localhost:8080/library
#
# Layout requirement: this repo (sasayaki-core/) must live as a SUBFOLDER named "Sasayaki"
# directly inside your library folder — e.g. <library>/Sasayaki/. That's what lets the app
# resolve its own parent as the library root. See INSTALL.md.
#
# Your library folder also needs two EMPTY sibling folders, "_data" and "_wiki", created
# before first run (INSTALL.md step 1). They hold the app's own state (tags, thumbnail
# cache, hide/delete records) -- never your original audio -- and are shadow-mounted
# read-write for the same OCI reason Sasayaki/ is: a bind-mount target must already exist
# as a real directory under the read-only library mount, or Docker can't attach to it.

services:
  sasayaki:
    build:
      context: .
      dockerfile: _deploy/Dockerfile
    image: sasayaki-core:latest
    container_name: sasayaki-core
    ports:
      - "8080:8080"
    volumes:
      # library, READ-ONLY. The app can never modify or delete an original audio file.
      - "${SASAYAKI_LIBRARY:?Set SASAYAKI_LIBRARY in .env to your media library folder}:/media:ro"
      # this app dir, read-write, shadow-mounted over the ro library so cache/log writes succeed.
      - ".:/media/Sasayaki:rw"
      # app-owned state (tags/thumbs/hide-delete records) -- read-write for the same reason.
      - "${SASAYAKI_LIBRARY}/_data:/media/_data:rw"
      - "${SASAYAKI_LIBRARY}/_wiki:/media/_wiki:rw"
    restart: unless-stopped
