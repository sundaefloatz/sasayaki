<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sasayaki 囁き</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================================
   app.html -- the persistent player shell. Holds the one <video id="au"> that must
   survive page navigation; actual page content (library/home/wiki/...) lives in the
   #stage iframe below it. Nav lives inside each iframe-loaded page (via realm.js) --
   this shell has none of its own, on purpose (see _brainstorm plan). Player CSS below
   is lifted near-verbatim from library.html's #player/#fullplayer so the two stay
   visually identical; EQ/sleep-timer/tracklist/CC/external-player are deferred (v2).
   ================================================================================ */
:root{color-scheme:dark;
  --bg:#181a1b;--surf:#1d1f20;--surf2:#232526;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.11);
  --txt:#e8e6e3;--muted:#9b958f;--dim:#5d5852;
  --pk:#e4405f;--pk2:#ff7a99;--pk3:rgba(228,64,95,.14);--pkg:rgba(228,64,95,.33);
  --gold:#f5c518;--blue:#5b8cff;--teal:#2dd4bf;
  --r:8px;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --body:"Zen Kaku Gothic New","Inter",system-ui,sans-serif;
  --disp:"Shippori Mincho",serif;
  --ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0c10;overflow:hidden}
body{color:var(--txt);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;background:#0c0c10}

/* ---- mini player (lifted from library.html's .player, unchanged) ---- */
.player{position:fixed;bottom:18px;right:18px;z-index:65;width:300px;
  background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);
  border:1px solid var(--line2);border-radius:12px;padding:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.55),0 0 20px var(--pk3);
  transform:translateY(20px) scale(.97);opacity:0;pointer-events:none;
  transition:transform .32s var(--ease),opacity .3s}
.player.up{transform:none;opacity:1;pointer-events:all}
@media(max-width:820px){.player{left:12px;right:12px;width:auto}}
.pwrap{display:flex;flex-direction:column;gap:10px}
.prow1{display:flex;align-items:center;gap:10px}
.pcov{width:44px;height:44px;border-radius:6px;flex:0 0 auto;overflow:hidden;background:var(--surf2)}
.pcov canvas{width:100%;height:100%;display:block}
.pmeta{flex:1;min-width:0}
.pmeta .pti{font:600 12px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.pmeta .pcr{font:10px var(--mono);color:var(--pk);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtns{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.pbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;padding:0}
.pbtn:hover{border-color:var(--line2);background:var(--surf);color:var(--txt)}
.pbtn.big{width:34px;height:34px;background:var(--pk);border-color:var(--pk);color:#fff;box-shadow:0 0 12px var(--pk3)}
.pbtn.big:hover{background:var(--pk2);color:#fff}
.pbtn.on{color:var(--pk2);border-color:var(--pk)}
.pbtn.cc{font:700 10px var(--mono);width:auto;padding:0 8px;letter-spacing:.04px}
.pbtn.cc.on{color:var(--pk);border-color:var(--pk)}
.pbtn svg{width:15px;height:15px}.pbtn.big svg{width:17px;height:17px}
.pseek{display:flex;align-items:center;gap:8px}
.ptime{font:10px var(--mono);color:var(--muted);flex:0 0 auto;width:36px}
.ptime.r{text-align:right}
.seekwrap{position:relative;flex:1;display:flex;align-items:center}
.prange{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);outline:none;cursor:pointer}
.prange::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--pk);cursor:pointer;box-shadow:0 0 6px var(--pkg)}
.prange::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--pk);cursor:pointer}
.pvol{position:relative;flex:0 0 auto}
.pbtn.vol{width:22px;height:22px}
.pbtn.vol svg{width:14px;height:14px}
.volpop{position:absolute;right:-6px;bottom:calc(100% + 8px);display:none;
  background:color-mix(in srgb,var(--bg) 98%,transparent);border:1px solid var(--line2);
  border-radius:8px;padding:9px 10px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.pvol:hover .volpop,.pvol:focus-within .volpop{display:block}
.prange.vol{flex:none;width:76px}
@media(min-width:820px){.volpop{position:static;display:block;background:none;border:none;padding:0;box-shadow:none}
  .prange.vol{width:60px}}

/* ---- full player overlay (lifted from library.html's #fullplayer) ---- */
#fullplayer{--bg:#0c0c10;--txt:#e8e6f0;--muted:#9490b0;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease);overflow:hidden}
#fullplayer.up{opacity:1;pointer-events:auto}
#fullplayer .fpbg{position:absolute;inset:0;z-index:0;background-position:center;background-size:cover;
  filter:blur(48px) brightness(.3) saturate(1.2);transform:scale(1.25)}
#fullplayer .fpbg::after{content:"";position:absolute;inset:0;background:rgba(10,10,14,.5)}
.fptop{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;z-index:3;
  display:flex;align-items:center;justify-content:flex-end;padding:0 18px}
.fpx{width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.fpx:hover{background:rgba(0,0,0,.55)}.fpx svg{width:20px;height:20px}
.fpmain{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;max-width:440px}
.fpcov{position:relative;width:min(64vw,300px);aspect-ratio:1;border-radius:16px;overflow:hidden;background:#15151f;
  box-shadow:0 0 40px var(--fpglow,rgba(228,64,95,.25)),0 12px 40px rgba(0,0,0,.6);
  transition:box-shadow .5s var(--ease),transform .3s var(--ease)}
.fpcov video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fpcov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fpcov.playing{transform:scale(1)}

/* ============ VIDEO THEATER MODE (ported from library.html, see that file's comment
   for the full rationale) — native aspect stage, contain-fit, cinema idle-hide chrome. */
#fullplayer[data-kind="video"] .fpmain{max-width:min(96vw,1600px)}
#fullplayer[data-kind="video"] .fpcov{
  width:auto;height:min(calc(100vh - 330px),78vh);max-width:96vw;
  aspect-ratio:var(--vid-ar,16/9);
  border-radius:10px;background:#000;cursor:pointer;
  box-shadow:0 18px 60px rgba(0,0,0,.75);}
#fullplayer[data-kind="video"] .fpcov video{object-fit:contain}
#fullplayer[data-kind="video"] .fpti{margin-top:18px;font-size:clamp(15px,2.4vw,20px)}
#fullplayer[data-kind="video"] .fpbg{filter:blur(60px) brightness(.16) saturate(1.1)}
#fullplayer[data-kind="video"] .fpcov.playing{transform:none}
/* SHORT VIEWPORTS (phone landscape) -- ported from library.html; see that file for rationale.
   The desktop rule reserves a fixed 330px of chrome, which on a 390px-tall viewport leaves ~60px
   of picture. Here the picture fills the screen and the transport floats over it. */
@media (max-height:500px){
  #fullplayer[data-kind="video"]{padding:0}
  #fullplayer[data-kind="video"] .fpmain{max-width:100vw;height:100%;justify-content:center}
  #fullplayer[data-kind="video"] .fpcov{
    height:100vh;width:100vw;max-width:100vw;border-radius:0;aspect-ratio:auto}
  #fullplayer[data-kind="video"] .fpti,
  #fullplayer[data-kind="video"] .fpcr{display:none}
  #fullplayer[data-kind="video"] .fpseek,
  #fullplayer[data-kind="video"] .fpctrl{position:absolute;left:0;right:0;z-index:4;margin:0;
    padding:0 16px;box-sizing:border-box}
  #fullplayer[data-kind="video"] .fpseek{bottom:64px}
  #fullplayer[data-kind="video"] .fpctrl{bottom:8px;gap:10px}
  #fullplayer[data-kind="video"] .fpctrl .fpb{width:40px;height:40px}
  #fullplayer[data-kind="video"] .fpctrl .fpb.pp{width:52px;height:52px}
  #fullplayer[data-kind="video"] .fpvol,
  #fullplayer[data-kind="video"] .fprow2{display:none}
  #fullplayer[data-kind="video"] .fpseek::before,
  #fullplayer[data-kind="video"] .fpctrl::before{content:"";position:absolute;inset:-8px 0;
    background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0));z-index:-1;pointer-events:none}
}
.fpvidhint{position:absolute;inset:0;z-index:2;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.32);transition:opacity .2s}
#fullplayer[data-kind="video"] .fpcov.paused .fpvidhint{display:flex}
.fpvidhint svg{width:58px;height:58px;color:#fff;filter:drop-shadow(0 3px 12px rgba(0,0,0,.6))}
#fullplayer[data-kind="video"].fp-idle .fptop,
#fullplayer[data-kind="video"].fp-idle .fpti,
#fullplayer[data-kind="video"].fp-idle .fpcr,
#fullplayer[data-kind="video"].fp-idle .fpseek,
#fullplayer[data-kind="video"].fp-idle .fpctrl,
#fullplayer[data-kind="video"].fp-idle .fpvol,
#fullplayer[data-kind="video"].fp-idle .fprow2{opacity:0;pointer-events:none;transition:opacity .45s}
#fullplayer[data-kind="video"].fp-idle{cursor:none}
#fullplayer .fptop,#fullplayer .fpti,#fullplayer .fpcr,#fullplayer .fpseek,
#fullplayer .fpctrl,#fullplayer .fpvol,#fullplayer .fprow2{transition:opacity .2s}
#fullplayer:not([data-kind="video"]) .vidonly{display:none}
.fprow2{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.fpti{font:700 clamp(17px,4.5vw,23px)/1.3 "Noto Serif JP",var(--disp);color:#fff;text-align:center;margin-top:26px;
  max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fpcr{font:600 12px var(--mono);color:var(--pk2);text-transform:uppercase;letter-spacing:.08em;margin-top:9px}
.fpseek{display:flex;align-items:center;gap:11px;width:100%;margin-top:26px}
.fpseek .ptime{font:11px var(--mono);color:var(--muted);flex:none;width:40px;font-variant-numeric:tabular-nums}
.fpseek .ptime.r{text-align:right}
.fpseekwrap{position:relative;flex:1;display:flex;align-items:center}
.fprange{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.16);outline:none;cursor:pointer}
.fprange::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--pk);cursor:pointer;box-shadow:0 0 8px var(--pk)}
.fprange::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--pk)}
.fpctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}
.fpb{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--txt);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex:none;position:relative}
.fpb:hover{background:rgba(255,255,255,.08);color:#fff}
.fpb svg{width:22px;height:22px}
.fpb.on{color:var(--pk2);border-color:var(--pk)}
.fpb.pp{width:64px;height:64px;background:var(--pk);border-color:var(--pk);color:#fff;box-shadow:0 4px 24px var(--pk3)}
.fpb.pp:hover{background:var(--pk2);color:#fff}.fpb.pp svg{width:28px;height:28px}
#fprepeat{position:relative}
.fprepeat1{position:absolute;top:1px;right:1px;font:800 8px var(--mono);line-height:1;background:var(--pk);
  color:#fff;border-radius:5px;padding:1px 3px;display:none}
#fprepeat.rep-one .fprepeat1{display:block}
.fps{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex:none;font-size:15px}
.fps:hover{color:var(--txt);border-color:var(--muted)}.fps.on{color:var(--pk2);border-color:var(--pk)}
.fps svg{width:18px;height:18px}
.fpvol{display:flex;align-items:center;gap:12px;width:min(70%,280px);margin-top:20px}
.fpvol .fprange{flex:1}

/* ============ SUBTITLE / TRANSCRIPT DRAWER (ported from library.html) ====================
   Synced bilingual cues for the playing work, click-to-seek, active cue tracked on timeupdate.
   In the shell this matters more than on the standalone page: the shell is where playback lives
   once you navigate away from /library, so without this the transcript was simply unreachable
   during normal use. z-index sits ABOVE #fullplayer (70) so it works over theater mode too. */
#transcript{position:fixed;top:0;right:0;width:380px;max-width:88vw;height:100vh;background:var(--bg);
  border-left:1px solid var(--line2);z-index:75;transform:translateX(100%);
  transition:transform .25s var(--ease);display:flex;flex-direction:column;
  box-shadow:-18px 0 40px rgba(0,0,0,.45)}
#transcript.up{transform:translateX(0)}
.trhead{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line);
  font:600 12px var(--mono);color:var(--txt)}
.trhead #trttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trhead .trx{cursor:pointer;color:var(--muted);font-size:19px;line-height:1}
.trhead .trx:hover{color:var(--pk2)}
.trlang{flex:none;font:700 9px var(--mono);color:var(--blue);opacity:.85}
.trbody{flex:1;overflow-y:auto;padding:6px 0 40vh}
.trcue{display:flex;gap:9px;padding:7px 15px;cursor:pointer;border-left:2px solid transparent;
  transition:background .15s}
.trcue:hover{background:var(--surf)}
.trcue.on{background:var(--pk3);border-left-color:var(--pk)}
.trcue .tct{flex:none;font:700 10px var(--mono);color:var(--dim);min-width:46px;padding-top:2px}
.trcue.on .tct{color:var(--pk)}
.trcue .tcb{flex:1;min-width:0}
.trcue .tcj{font-size:12px;color:var(--muted);line-height:1.5}
.trcue .tce{font-size:12.5px;color:var(--txt);line-height:1.45;margin-top:2px}
.trcue .tck{font-size:12.5px;color:#7dd3fc;line-height:1.45;margin-top:2px}   /* ko — cyan */
.trnone{color:var(--dim);font-size:12px;padding:24px 16px;text-align:center}
/* the docked mini player slides clear of the open drawer instead of hiding under it */
body.tr-open .player.up{right:calc(380px + 18px)}
@media(max-width:820px){body.tr-open .player.up{right:12px}}
/* on a short viewport the drawer would bury the floating video transport -- go full-width sheet */
@media (max-height:500px){#transcript{width:min(420px,100vw)}}
@media(min-width:900px){.fpcov{width:300px}}
</style>
</head><body>

<iframe id="stage" title="Sasayaki"></iframe>

<!-- bottom player bar (docked mini-player, bottom-right) -->
<div class="player" id="player">
  <div class="pwrap">
    <div class="prow1">
      <div class="pcov"><canvas id="pcov" width="100" height="100"></canvas></div>
      <div class="pmeta"><div class="pti" id="pti">—</div><div class="pcr" id="pcr"></div></div>
      <div class="pbtns">
        <button class="pbtn" id="prev" title="previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6l-9 6 9 6z"/></svg></button>
        <button class="pbtn" id="rw" title="back 15s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4 5 9l6 5"/><path d="M5 9h9a6 6 0 1 1 0 12H9"/></svg></button>
        <button class="pbtn big" id="pp" title="play / pause"></button>
        <button class="pbtn" id="ff" title="forward 15s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 4 6 5-6 5"/><path d="M19 9h-9a6 6 0 1 0 0 12h5"/></svg></button>
        <button class="pbtn" id="next" title="next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg></button>
        <button class="pbtn" id="shuffle" title="shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 4 4 4-4 4"/><path d="M2 8h5.5a4 4 0 0 1 3.3 1.8L15 16.2A4 4 0 0 0 18.5 18H22"/><path d="m18 20 4-4-4-4"/><path d="M2 4h5.5a4 4 0 0 1 3.3 1.8L11.5 6.5"/><path d="M14.5 17.5 15 18.2"/></svg></button>
        <button class="pbtn cc" id="ccbtn" title="subtitles / transcript">CC</button>
      </div>
    </div>
    <div class="pseek">
      <span class="ptime" id="cur">0:00</span>
      <div class="seekwrap"><input type="range" class="prange" id="seek" min="0" max="1000" value="0" step="1"></div>
      <span class="ptime r" id="tot">0:00</span>
      <div class="pvol" id="pvol">
        <button class="pbtn vol" id="volbtn" title="mute / unmute"></button>
        <div class="volpop"><input type="range" class="prange vol" id="volrange" min="0" max="100" value="100" step="1"></div>
      </div>
    </div>
  </div>
</div>

<!-- full-screen player overlay -->
<div id="fullplayer">
  <div class="fpbg" id="fpbg"></div>
  <div class="fptop" style="justify-content:space-between">
    <button class="fpx" id="fpclose" title="minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="fpx" id="fpcc2" title="subtitles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 11h2M7 14h4M13 11h4M15 14h2"/></svg></button>
  </div>
  <div class="fpmain">
    <div class="fpcov" id="fpcov"><video id="au" preload="none" playsinline></video><img id="fpcovimg" alt=""><div class="fpvidhint" id="fpvidhint"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div></div>
    <div class="fpti" id="fpti2">—</div>
    <div class="fpcr" id="fpcr2"></div>
    <div class="fpseek">
      <span class="ptime" id="fpcur">0:00</span>
      <div class="fpseekwrap"><input type="range" class="fprange" id="fpseek" min="0" max="1000" value="0" step="1"></div>
      <span class="ptime r" id="fptot">0:00</span>
    </div>
    <div class="fpctrl">
      <button class="fpb" id="fpshuffle" title="shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 4 4 4-4 4"/><path d="M2 8h5.5a4 4 0 0 1 3.3 1.8L15 16.2A4 4 0 0 0 18.5 18H22"/><path d="m18 20 4-4-4-4"/><path d="M2 4h5.5a4 4 0 0 1 3.3 1.8L11.5 6.5"/><path d="M14.5 17.5 15 18.2"/></svg></button>
      <button class="fpb" id="fpprev" title="previous track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6l-9 6 9 6z"/></svg></button>
      <button class="fpb" id="fprw" title="back 15s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4 5 9l6 5"/><path d="M5 9h9a6 6 0 1 1 0 12H9"/></svg></button>
      <button class="fpb pp" id="fppp" title="play / pause"></button>
      <button class="fpb" id="fpff" title="forward 15s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 4 6 5-6 5"/><path d="M19 9h-9a6 6 0 1 0 0 12h5"/></svg></button>
      <button class="fpb" id="fpnext" title="next track"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg></button>
      <button class="fpb" id="fprepeat" title="repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><b id="fprepeat1" class="fprepeat1">1</b></button>
    </div>
    <div class="fpvol" id="fpvolrow">
      <button class="fps" id="fpvolbtn" title="mute / unmute"></button>
      <input type="range" class="fprange vol" id="fpvolrange" min="0" max="100" value="100" step="1">
    </div>
    <div class="fprow2">
      <button class="fps vidonly" id="fpfs" title="fullscreen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
      <button class="fps vidonly" id="fppip" title="picture-in-picture (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="8" height="7" rx="1" fill="currentColor" stroke="none"/></svg></button>
    </div>
  </div>
</div>

<!-- subtitle / transcript drawer -->
<div id="transcript">
  <div class="trhead"><span id="trttl">—</span><span class="trlang" id="trlang"></span><span class="trx" id="trx">×</span></div>
  <div class="trbody" id="trbody"><div class="trnone">play a work, then hit CC to follow its subtitles</div></div>
</div>

<script>
/* ================================================================================
   Independent shell player. NOT hoisted from library.html -- QUEUE there is derived
   from the grid's own render(), which doesn't exist here. This re-implements the
   same behavior (15s seek, shuffle, repeat, Media Session, keyboard shortcuts)
   against the shell's own ALL/QUEUE, fed by /library.json + postMessage from the
   iframe. Preferences (volume/shuffle/repeat) share localStorage keys with
   library.html's standalone player, so they stay in sync either way.
   ================================================================================ */
const $=id=>document.getElementById(id);
const au=$('au'),pl=$('player'),fp=$('fullplayer');
const SEEK_STEP=15;
let fpOpen=false;
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const ICON_VOL='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_VOL_MUTE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8l5 8M21 8l-5 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

function fmtT(s){s=Math.max(0,s|0);const m=(s/60)|0,ss=s%60;return m+':'+(ss<10?'0':'')+ss;}
function hhmmss(s){s=s|0;const h=(s/3600)|0,m=((s%3600)/60)|0,ss=s%60;return (h?h+':':'')+((h&&m<10)?'0':'')+m+':'+(ss<10?'0':'')+ss;}
function titleOf(w){const lang=localStorage.getItem('sasa_lang')||'en';return lang==='ja'?(w.ja||w.title):(w.title||w.ja);}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));}

/* ---- library data: the shell's own copy, independent of whatever page is in the iframe ---- */
let ALL=[],QUEUE=[],curId=null;
function loadLibrary(realm){
  const u='/library.json'+(realm==='sandbox'?'?realm=sandbox':'');
  // MERGE into ALL, never overwrite: a sandbox-retry fetch must not wipe out the core works (or the
  // shell could never find/play a core work again after one sandbox play). Also tolerate an
  // unreachable server without throwing.
  return fetch(u,{cache:'no-store'}).then(r=>r.json()).then(d=>{
    const rows=Array.isArray(d)?d:(d.works||[]);
    const seen=new Set(ALL.map(w=>w.id));
    rows.forEach(w=>{if(w&&w.id&&!seen.has(w.id))ALL.push(w);});
    return ALL;
  }).catch(()=>ALL);
}
loadLibrary();

function curIndex(){return QUEUE.findIndex(w=>w.id===curId);}
function markActive(){}   // no grid here to highlight -- shell has no card list
function ppIcon(){$('pp').innerHTML=au.paused?ICON_PLAY:ICON_PAUSE;$('fppp').innerHTML=au.paused?ICON_PLAY:ICON_PAUSE;}
function cover(cv,w){   // mini-player cover: monogram immediately, real thumb drawn over it once loaded
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,cr=(w&&w.creator)||'';
  let h=0;for(let i=0;i<cr.length;i++)h=(h*31+cr.charCodeAt(i))%360;
  ctx.fillStyle='hsl('+h+',40%,18%)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='hsl('+h+',55%,72%)';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 '+Math.round(W*.4)+'px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText((cr.trim()[0]||'♪'),W/2,H/2+W*.02);
  if(w&&w.thumb){const im=new Image();im.onload=()=>{if(curId===w.id)ctx.drawImage(im,0,0,W,H);};im.src=w.thumb;}
}
function mediaArtwork(w){return(w&&w.thumb)?[{src:w.thumb,sizes:'512x512'}]:[];}
function syncMediaSession(w){
  if(!('mediaSession' in navigator)||!w)return;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:titleOf(w),artist:w.creator||'',album:'Sasayaki',artwork:mediaArtwork(w)});}catch(e){}
}
function refreshFull(w){
  if(!w)return;
  $('fpti2').textContent=titleOf(w);$('fpcr2').textContent=w.creator;
  $('fptot').textContent=w.dur?fmtT(w.dur):'0:00';
  const img=$('fpcovimg'),bg=$('fpbg');
  fp.dataset.kind = (w.kind==='video') ? 'video' : 'audio';   // drives theater mode in CSS
  if(w.kind==='video'){img.removeAttribute('src');img.style.display='none';bg.style.backgroundImage=w.thumb?`url("${w.thumb}")`:'';}
  else if(w.thumb){img.src=w.thumb;img.style.display='';bg.style.backgroundImage=`url("${w.thumb}")`;}
  else{img.removeAttribute('src');img.style.display='none';bg.style.backgroundImage='';}
}
function playWorkById(id,realmRetry){
  const w=ALL.find(x=>x.id===id);
  if(!w){
    if(!realmRetry){loadLibrary('sandbox').then(()=>playWorkById(id,true));}   // sandbox-realm work the core fetch missed
    return;
  }
  playWork(w);
}
function playWork(w){if(!w)return;curId=w.id;
  au.src='/audio?id='+encodeURIComponent(w.id);au.play().catch(()=>{});
  pl.classList.add('up');$('pti').textContent=titleOf(w);$('pcr').textContent=w.creator;
  $('tot').textContent=w.dur?fmtT(w.dur):'0:00';$('cur').textContent='0:00';$('seek').value=0;
  cover($('pcov'),w);markActive();refreshFull(w);syncMediaSession(w);loadSubs(w);
}
/* ---- subtitle / transcript drawer (ported from library.html) ------------------------------
   Cues come from /subs?id=, which shells out to subs_for.py -- so this needs no GPU and no
   network: it just reads whatever .srt tiers already exist in _data/derived for that work. */
var CUES=[],curCue=-1,ccOpen=false;
function loadSubs(w){CUES=[];curCue=-1;$('trttl').textContent=titleOf(w);$('trlang').textContent='';
  $('trbody').innerHTML='<div class="trnone">loading subtitles…</div>';
  fetch('/subs?id='+encodeURIComponent(w.id)).then(r=>r.json()).then(d=>{
    CUES=d.cues||[];$('trlang').textContent=d.lang?d.lang:'';
    if(!CUES.length){$('trbody').innerHTML='<div class="trnone">no subtitles for this work yet</div>';return;}
    $('trbody').innerHTML=CUES.map((c,i)=>'<div class="trcue" data-i="'+i+'" data-t="'+c.t0+'">'+
      '<span class="tct">'+hhmmss(c.t0)+'</span><span class="tcb">'+
      (c.ja?'<div class="tcj">'+esc(c.ja)+'</div>':'')+(c.en?'<div class="tce">'+esc(c.en)+'</div>':'')+
      (c.ko?'<div class="tck">'+esc(c.ko)+'</div>':'')+
      '</span></div>').join('');
    $('trbody').querySelectorAll('.trcue').forEach(el=>el.addEventListener('click',()=>{
      var t=parseFloat(el.dataset.t)||0;try{au.currentTime=t;}catch(e){}au.play().catch(()=>{});}));
  }).catch(()=>{$('trbody').innerHTML='<div class="trnone">could not load subtitles</div>';});}
function syncCue(){if(!CUES.length)return;var t=au.currentTime,lo=0,hi=CUES.length-1,idx=-1;
  while(lo<=hi){var mid=(lo+hi)>>1;if(CUES[mid].t0<=t){idx=mid;lo=mid+1;}else hi=mid-1;}
  if(idx===curCue)return;var rows=$('trbody').children;
  if(curCue>=0&&rows[curCue])rows[curCue].classList.remove('on');
  curCue=idx;
  if(idx>=0&&rows[idx]){rows[idx].classList.add('on');if(ccOpen)rows[idx].scrollIntoView({block:'center',behavior:'smooth'});}}
function toggleCC(){ccOpen=!ccOpen;$('transcript').classList.toggle('up',ccOpen);
  $('ccbtn').classList.toggle('on',ccOpen);$('fpcc2').classList.toggle('on',ccOpen);
  document.body.classList.toggle('tr-open',ccOpen);   /* slides the mini player clear of the drawer */
  if(ccOpen&&curCue>=0){var r=$('trbody').children[curCue];if(r)r.scrollIntoView({block:'center'});}}
$('ccbtn').addEventListener('click',toggleCC);
$('trx').addEventListener('click',toggleCC);
$('fpcc2').addEventListener('click',toggleCC);
au.addEventListener('timeupdate',syncCue);

function openFull(){if(!curId)return;fpOpen=true;fp.classList.add('up');ppIcon();
  if(window.fpVideoWake)window.fpVideoWake();}
function closeFull(){fpOpen=false;fp.classList.remove('up');fp.classList.remove('fp-idle');
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}
$('pcov').addEventListener('click',openFull);$('pti').addEventListener('click',openFull);$('pcr').addEventListener('click',openFull);
$('fpclose').addEventListener('click',closeFull);
/* ---- video theater behaviour: native aspect, click-to-toggle, fullscreen, PiP, idle-hide ----
   Ported from library.html (see that file for the full rationale comment). No SASA_EMBEDDED
   guard needed here -- app.html IS the shell, never embedded inside another page's iframe. */
(function videoTheater(){
  const cov=$('fpcov'),fsBtn=$('fpfs'),pipBtn=$('fppip');
  const isVideo=()=>fp.dataset.kind==='video';
  function applyAspect(){
    const vw=au.videoWidth,vh=au.videoHeight;
    if(vw&&vh){
      cov.style.setProperty('--vid-ar',vw+' / '+vh);
    }else if(fp.dataset.kind==='video'&&au.readyState>=1){
      fp.dataset.kind='audio';   // audio-only despite the video file extension
      const cur=QUEUE.find(x=>x.id===curId),img=$('fpcovimg');
      if(cur&&cur.thumb){img.src=cur.thumb;img.style.display='';}
    }
  }
  au.addEventListener('loadedmetadata',applyAspect);
  au.addEventListener('resize',applyAspect);
  const syncPaused=()=>cov.classList.toggle('paused',au.paused);
  au.addEventListener('play',syncPaused);au.addEventListener('pause',syncPaused);syncPaused();
  let clickT=null;
  cov.addEventListener('click',e=>{
    if(!isVideo())return;
    if(clickT){clearTimeout(clickT);clickT=null;toggleFs();return;}
    clickT=setTimeout(()=>{clickT=null;if(au.paused)au.play().catch(()=>{});else au.pause();},220);
  });
  function toggleFs(){
    const cur=document.fullscreenElement||document.webkitFullscreenElement;
    if(cur){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{(fp.requestFullscreen||fp.webkitRequestFullscreen||(()=>{})).call(fp);}
  }
  if(fsBtn)fsBtn.addEventListener('click',toggleFs);
  document.addEventListener('fullscreenchange',()=>{
    if(fsBtn)fsBtn.classList.toggle('on',!!document.fullscreenElement);
  });
  if(pipBtn){
    if(!document.pictureInPictureEnabled)pipBtn.style.display='none';
    pipBtn.addEventListener('click',async()=>{
      try{
        if(document.pictureInPictureElement)await document.exitPictureInPicture();
        else if(au.readyState>=1)await au.requestPictureInPicture();
      }catch(e){}
    });
    au.addEventListener('enterpictureinpicture',()=>pipBtn.classList.add('on'));
    au.addEventListener('leavepictureinpicture',()=>pipBtn.classList.remove('on'));
  }
  let idleT=null;
  function wake(){
    fp.classList.remove('fp-idle');
    clearTimeout(idleT);
    if(isVideo()&&!au.paused)idleT=setTimeout(()=>fp.classList.add('fp-idle'),3000);
  }
  ['mousemove','mousedown','touchstart','keydown','wheel'].forEach(ev=>
    fp.addEventListener(ev,wake,{passive:true}));
  au.addEventListener('pause',()=>{clearTimeout(idleT);fp.classList.remove('fp-idle');});
  au.addEventListener('play',wake);
  window.fpVideoWake=wake;
  document.addEventListener('keydown',e=>{
    if(!fpOpen||!isVideo()||e.target.tagName==='INPUT')return;
    if(e.code==='KeyF'){e.preventDefault();toggleFs();}
    else if(e.code==='KeyP'&&pipBtn){e.preventDefault();pipBtn.click();}
  });
})();

/* ---- shuffle + repeat (shares localStorage keys with library.html's standalone player) ---- */
let SHUFFLE=localStorage.getItem('sasa_shuffle')==='1';
let REPEAT=localStorage.getItem('sasa_repeat')||'all';
let shufOrder=[],shufPos=-1;
const SHUF_BTNS=['shuffle','fpshuffle'],REPEAT_BTNS=['fprepeat'];
function buildShufOrder(){shufOrder=QUEUE.map((_,i)=>i);
  for(let i=shufOrder.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[shufOrder[i],shufOrder[j]]=[shufOrder[j],shufOrder[i]];}
  shufPos=shufOrder.indexOf(curIndex());}
function shufIcon(){SHUF_BTNS.forEach(id=>{const b=$(id);if(b)b.classList.toggle('on',SHUFFLE);});}
function repeatIcon(){REPEAT_BTNS.forEach(id=>{const b=$(id);if(!b)return;b.classList.toggle('on',REPEAT!=='off');b.classList.toggle('rep-one',REPEAT==='one');});}
function setShuffle(v){SHUFFLE=v;localStorage.setItem('sasa_shuffle',v?'1':'0');if(v)buildShufOrder();shufIcon();}
function setRepeat(v){REPEAT=v;localStorage.setItem('sasa_repeat',v);repeatIcon();}
function cycleRepeat(){setRepeat(REPEAT==='off'?'all':REPEAT==='all'?'one':'off');}
shufIcon();repeatIcon();
function seekBy(d){if(au.duration)au.currentTime=Math.max(0,Math.min(au.duration,au.currentTime+d));}
function step(d){
  if(!QUEUE.length)return;
  if(SHUFFLE){
    if(shufOrder.length!==QUEUE.length)buildShufOrder();
    shufPos=(shufPos+d+shufOrder.length)%shufOrder.length;
    playWork(QUEUE[shufOrder[shufPos]]);return;
  }
  const i=curIndex();if(i<0){playWork(QUEUE[0]);return;}
  playWork(QUEUE[(i+d+QUEUE.length)%QUEUE.length]);
}
$('pp').addEventListener('click',()=>{if(au.paused){if(!au.src&&QUEUE.length)playWork(QUEUE[0]);else au.play().catch(()=>{});}else au.pause();});
$('fppp').addEventListener('click',()=>{if(au.paused){if(!au.src&&QUEUE.length)playWork(QUEUE[0]);else au.play().catch(()=>{});}else au.pause();});
$('prev').addEventListener('click',()=>step(-1));$('next').addEventListener('click',()=>step(1));
$('fpprev').addEventListener('click',()=>step(-1));$('fpnext').addEventListener('click',()=>step(1));
$('rw').addEventListener('click',()=>seekBy(-SEEK_STEP));$('ff').addEventListener('click',()=>seekBy(SEEK_STEP));
$('fprw').addEventListener('click',()=>seekBy(-SEEK_STEP));$('fpff').addEventListener('click',()=>seekBy(SEEK_STEP));
$('shuffle').addEventListener('click',()=>setShuffle(!SHUFFLE));
$('fpshuffle').addEventListener('click',()=>setShuffle(!SHUFFLE));
$('fprepeat').addEventListener('click',cycleRepeat);

au.addEventListener('play',()=>{ppIcon();au.classList.add('playing');$('fpcov').classList.add('playing');
  if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing';});
au.addEventListener('pause',()=>{ppIcon();au.classList.remove('playing');$('fpcov').classList.remove('playing');
  if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused';});
au.addEventListener('ended',()=>{
  if(REPEAT==='one'){au.currentTime=0;au.play().catch(()=>{});return;}
  if(REPEAT==='off'){const atEnd=SHUFFLE?(shufPos>=shufOrder.length-1):(curIndex()>=QUEUE.length-1);if(atEnd)return;}
  step(1);
});
au.addEventListener('loadedmetadata',()=>{if(isFinite(au.duration)){$('tot').textContent=fmtT(au.duration);$('fptot').textContent=fmtT(au.duration);}});
let seeking=false;
const seek=$('seek'),fpseekEl=$('fpseek');
au.addEventListener('timeupdate',()=>{
  if(seeking||!au.duration)return;
  $('cur').textContent=fmtT(au.currentTime);seek.value=Math.round(au.currentTime/au.duration*1000);
  $('fpcur').textContent=fmtT(au.currentTime);fpseekEl.value=Math.round(au.currentTime/au.duration*1000);
});
seek.addEventListener('input',()=>{seeking=true;if(au.duration)$('cur').textContent=fmtT(au.duration*seek.value/1000);});
seek.addEventListener('change',()=>{if(au.duration)au.currentTime=au.duration*seek.value/1000;seeking=false;});
fpseekEl.addEventListener('input',()=>{seeking=true;if(au.duration)$('fpcur').textContent=fmtT(au.duration*fpseekEl.value/1000);});
fpseekEl.addEventListener('change',()=>{if(au.duration)au.currentTime=au.duration*fpseekEl.value/1000;seeking=false;});
ppIcon();

/* ---- volume (persisted, shared with library.html) ---- */
const volrange=$('volrange'),fpvolrange=$('fpvolrange');
function volIcon(){const ic=(au.muted||au.volume===0)?ICON_VOL_MUTE:ICON_VOL;['volbtn','fpvolbtn'].forEach(id=>{const b=$(id);if(b)b.innerHTML=ic;});}
function volSet(v,persist){v=Math.max(0,Math.min(1,v));au.muted=false;au.volume=v;
  volrange.value=Math.round(v*100);if(fpvolrange)fpvolrange.value=Math.round(v*100);
  if(persist!==false)localStorage.setItem('sasa_vol',v);volIcon();}
(function initVol(){let v=parseFloat(localStorage.getItem('sasa_vol'));if(!isFinite(v)||v<0||v>1)v=1;volSet(v,false);})();
volrange.addEventListener('input',()=>volSet(volrange.value/100));
fpvolrange.addEventListener('input',()=>volSet(fpvolrange.value/100));
$('volbtn').addEventListener('click',()=>{au.muted=!au.muted;volIcon();});
$('fpvolbtn').addEventListener('click',()=>{au.muted=!au.muted;volIcon();});

/* ---- Media Session API (hardware keys / lock-screen / OS mini-player) ---- */
if('mediaSession' in navigator){
  const msSet=(action,fn)=>{try{navigator.mediaSession.setActionHandler(action,fn);}catch(e){}};
  msSet('play',()=>{if(!au.src&&QUEUE.length)playWork(QUEUE[0]);else au.play().catch(()=>{});});
  msSet('pause',()=>au.pause());
  msSet('previoustrack',()=>step(-1));
  msSet('nexttrack',()=>step(1));
  msSet('seekbackward',()=>seekBy(-SEEK_STEP));
  msSet('seekforward',()=>seekBy(SEEK_STEP));
  msSet('seekto',e=>{if(au.duration&&e&&e.seekTime!=null)au.currentTime=Math.max(0,Math.min(au.duration,e.seekTime));});
  au.addEventListener('timeupdate',()=>{
    if(!isFinite(au.duration)||au.duration<=0)return;
    try{navigator.mediaSession.setPositionState({duration:au.duration,playbackRate:au.playbackRate||1,position:Math.min(au.currentTime,au.duration)});}catch(e){}
  });
}

/* ---- keyboard shortcuts (mirrors library.html's, minus CC/Escape-to-close-transcript which don't exist here) ---- */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Escape'){if(ccOpen){toggleCC();}else if(fpOpen){closeFull();}return;}   // CC first, then overlay
  if(e.code==='KeyC'){e.preventDefault();toggleCC();return;}
  if(e.code==='Space'){e.preventDefault();$('pp').click();}
  else if(e.code==='ArrowRight')step(1);else if(e.code==='ArrowLeft')step(-1);
  else if(e.code==='ArrowUp'){e.preventDefault();volSet(au.volume+.05);}
  else if(e.code==='ArrowDown'){e.preventDefault();volSet(au.volume-.05);}
  else if(e.code==='KeyM'){au.muted=!au.muted;volIcon();}
  else if(e.code==='KeyJ')seekBy(-SEEK_STEP);else if(e.code==='KeyL')seekBy(SEEK_STEP);
  else if(e.code==='KeyS')setShuffle(!SHUFFLE);
  else if(e.code==='KeyR')cycleRepeat();
});

/* ---- postMessage from an embedded content page (see realm.js's interceptor + library.html's
   playWork embedded branch): {sasa:true, type:'play', id, queueIds}. Origin-checked. ---- */
window.addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data||e.data.sasa!==true)return;
  if(e.data.type==='play'){
    const ids=Array.isArray(e.data.queueIds)&&e.data.queueIds.length?e.data.queueIds:[e.data.id];
    QUEUE=ids.map(id=>ALL.find(w=>w.id===id)).filter(Boolean);
    if(!QUEUE.length)QUEUE=[{id:e.data.id}];   // resolved lazily by playWorkById's sandbox-retry below
    if(SHUFFLE)buildShufOrder();
    playWorkById(e.data.id);
  }
});

/* ---- iframe stage + URL sync (?p=<path> seeds it; back/forward + in-app nav stay in sync) ---- */
const stage=$('stage');
// ?p= is attacker-influenceable (crafted /app?p=... link). Only ever load a SAME-ORIGIN absolute
// path into the iframe -- reject 'javascript:...', 'https://evil', '//evil' etc., which would
// otherwise frame arbitrary content or run script in this origin.
function safePath(p){return (typeof p==='string'&&p[0]==='/'&&p[1]!=='/')?p:'/home';}
function iframePath(){try{return stage.contentWindow.location.pathname+stage.contentWindow.location.search;}catch(err){return null;}}
stage.addEventListener('load',()=>{
  const p=iframePath();
  if(p)history.replaceState(null,'','/app?p='+encodeURIComponent(p));
});
window.addEventListener('popstate',()=>{
  const want=safePath(new URLSearchParams(location.search).get('p'));
  if(want!==iframePath())stage.src=want;
});
stage.src=safePath(new URLSearchParams(location.search).get('p'));
</script>
</body></html>
